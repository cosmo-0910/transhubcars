name: iOS Build
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          cd TranshubMobile/ios
          pod install

      - name: Build for Simulator
        run: |
          cd TranshubMobile/ios
          xcodebuild -workspace TranshubMobile.xcworkspace \
            -scheme TranshubMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-simulator-app
          path: TranshubMobile/ios/build/Build/Products/Debug-iphonesimulator/TranshubMobile.app
